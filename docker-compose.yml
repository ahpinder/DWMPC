services:
  dwmpc:
    build: .
    image: dwmpc
    environment:
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=glfw
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/dri:/dev/dri

  benchmark_2problem:
    build: .
    image: dwmpc
    environment:
      - MUJOCO_GL=egl
    volumes:
      - ./benchmark:/opt/DWMPC/benchmark
    command: python3 benchmark/bench_dwmpc.py --out benchmark/results_2problem.json
  
  benchmark_4problem:
    build: .
    image: dwmpc
    environment:
      - MUJOCO_GL=egl
    volumes:
      - ./benchmark:/opt/DWMPC/benchmark
    command: python3 benchmark/bench_dwmpc.py --config config/config_4leg.yaml --out benchmark/results_4leg.json